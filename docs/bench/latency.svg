kc-dl49{animation-delay:2.45s!important}.kc-dl50{animation-delay:2.50s!important}.kc-dl51{animation-delay:2.55s!important}.kc-dl52{animation-delay:2.60s!important}.kc-dl53{animation-delay:2.65s!important}.kc-dl54{animation-delay:2.70s!important}.kc-dl55{animation-delay:2.75s!important}.kc-dl56{animation-delay:2.80s!important}.kc-dl57{animation-delay:2.85s!important}.kc-dl58{animation-delay:2.90s!important}.kc-dl59{animation-delay:2.95s!important}.kc-dl60{animation-delay:3.00s!important}.kc-b0{background:#ff7a59}svg text.kc-t0,svg text.kc-t0{fill:#ff7a59}.kc-b1{background:#4c8dff}svg text.kc-t1,svg text.kc-t1{fill:#4c8dff}.kc-b2{background:#30d158}svg text.kc-t2,svg text.kc-t2{fill:#30d158}.kc-b3{background:#bf5af2}svg text.kc-t3,svg text.kc-t3{fill:#bf5af2}.kc-b4{background:#ffd60a}svg text.kc-t4,svg text.kc-t4{fill:#ffd60a}.kc-raw{margin:4px 0 18px}.kc-raw summary{cursor:pointer;color:var(--muted);font-size:13.5px;margin-bottom:8px}
